[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi-india-etl"
version = "1.0.0"
description = "Production-grade, resilient Air Quality Index (AQI) ETL Pipeline for Indian metropolitan regions."
readme = "README.md"
authors = [
    { name = "Harsh Bhagat", email = "hb24mcf1r14@student.nitw.ac.in" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "live: marks tests that connect to live external API (deselect with '-m \"not live\"')",
]
